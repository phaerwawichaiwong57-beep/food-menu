<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านอร่อยตามสั่ง</title>
    <style>
        :root {
            --primary-color: #e65c00;
            --secondary-color: #f9f9f9;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff5eb;
            color: var(--text-color);
        }
        header {
            background: linear-gradient(135deg, #ff751a, #e65c00);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 { margin: 0; font-size: 2.5rem; }
        header p { margin: 10px 0 0; font-size: 1.1rem; opacity: 0.9; }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        h2 { border-left: 5px solid var(--primary-color); padding-left: 10px; margin-bottom: 25px; }
        #menu {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }
        .food-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .food-card:hover { transform: translateY(-5px); }
        .food-image-box {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            background-color: #fff0e0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .food-card h3 { margin: 10px 0 5px; font-size: 1.2rem; }
        .price { color: var(--primary-color); font-weight: bold; font-size: 1.1rem; margin: 5px 0 15px; }
        .add-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        .add-btn:hover { background-color: #cc5200; }
    </style>
</head>
<body>

    <header>
        <h1>🍳 ร้านอร่อยตามสั่ง</h1>
        <p>อร่อย สดใหม่ สั่งง่ายผ่าน QR Code</p>
    </header>

    <div class="container">
        <h2>📋 เมนูอาหาร 20 รายการ</h2>
        <!-- บล็อกนี้จะเปิดทางให้ script.js ดึงไอคอนและรายชื่อมาแสดงผลตามที่เราสั่ง -->
        <div id="menu"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
